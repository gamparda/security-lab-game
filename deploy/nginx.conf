# Example: serve these static assets behind your existing HTTPS reverse proxy.
server {
    listen 8080;
    server_name _;
    root /srv/security-lab-game;
    index index.html;
    charset utf-8;
    include /etc/nginx/mime.types;
    default_type text/plain;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;

    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /src/style.css { try_files $uri =404; }
    location ~ ^/src/(app|engine|missions|storage)\.js$ { try_files $uri =404; }
    location / { return 404; }
}
