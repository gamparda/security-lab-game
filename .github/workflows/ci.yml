name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run vendor -- --check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run check
        env:
          SECURITYLAB_CROSS_BROWSER: '1'
          SECURITYLAB_HEADED: '1'
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics
          path: test-results/
          retention-days: 7
  windows:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/package.yml
    with:
      runner: windows-latest
