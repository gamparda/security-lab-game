name: Publish verified portable
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - docs/RELEASE.md
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows package run ID
        required: true
        type: string
      tag:
        description: Release tag matching package.json, such as v0.2.0
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release version
        id: version
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          tag = 'v' + version
          publish = True
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == tag, 'Tag must match package.json'
          else:
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              previous = json.loads(subprocess.check_output(['git', 'show', event['before'] + ':package.json']))['version']
              publish = tuple(map(int, version.split('.'))) > tuple(map(int, previous.split('.')))
              if version == previous:
                  # A failed package run creates no tag. Publish the corrected
                  # build with the same still-unreleased version.
                  publish = subprocess.run(['git', 'show-ref', '--verify', '--quiet', 'refs/tags/' + tag]).returncode == 1
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'publish={str(publish).lower()}\ntag={tag}\n')
          PY
  package:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/package.yml
    with:
      runner: windows-latest
  release:
    needs: [prepare, package]
    if: ${{ always() && ((github.event_name == 'push' && needs.package.result == 'success') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify package run
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.run_id }}
          RELEASE_TAG: ${{ inputs.tag || needs.prepare.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['RUN_ID']
          assert run_id.isdecimal()
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Use a stable version tag such as v0.2.0'
          version = json.loads(Path('package.json').read_text())['version']
          assert tag == 'v' + version, 'Release tag must match package.json'
          sha = os.environ['GITHUB_SHA']
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
              assert run['conclusion'] == 'success' and run['path'] == '.github/workflows/package.yml'
              assert run['head_sha'] == sha, 'Package and release must use the same commit'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\nrun_id={run_id}\ntag={tag}\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: SecurityLab-Windows-X64
          path: portable
          run-id: ${{ steps.package.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble release archives
        run: python3 scripts/assemble_release.py
      - name: Publish portable release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.package.outputs.sha }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" "release/SecurityLab-$RELEASE_TAG-Windows-x64.zip" "release/SecurityLab-$RELEASE_TAG-Windows-x64.exe" "release/SHA256SUMS-$RELEASE_TAG.txt" --target "$TARGET_SHA" --title "Security Lab $RELEASE_TAG" --notes-file docs/RELEASE.md --latest
