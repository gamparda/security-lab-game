name: Package executable
on:
  workflow_call:
    inputs:
      runner:
        description: Target OS runner
        required: true
        type: string
  workflow_dispatch:
    inputs:
      runner:
        description: Target OS runner
        type: choice
        required: true
        options:
          - windows-latest
          - macos-14
          - ubuntu-latest
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install pyinstaller==6.16.0
      - run: python scripts/package.py
      - run: npm ci
      - run: npx playwright install chromium
      - name: Test engine and server
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test standalone Windows launcher and game
        timeout-minutes: 6
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows_launcher.ps1
      - name: Test packaged Unix executable
        if: runner.os != 'Windows'
        run: GAME_SERVER='dist/SecurityLab --smoke-test' npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: SecurityLab-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/SecurityLab*
          if-no-files-found: error
          retention-days: 90
